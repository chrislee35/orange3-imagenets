[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orange3-imagenets"
version = "0.0.4"
description = "A collection of Orange3 widgets for training and applying neural networks to images"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
authors = [
    { name = "Chris Lee", email = "github@chrislee.dhs.org" },
]
keywords = ["orange3 add-on"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only"
]
dependencies = [
    "Orange3 >= 3.39.0",
    "orange-canvas-core >= 0.1.28",
    "orange-widget-base >= 4.20.0",
    "Orange3-ImageAnalytics >= 0.13.0",
    "opencv-python-headless >= 4.12",
    "keras >= 3.10.0",
    "tf_keras >= 2.19.0"
]

[project.optional-dependencies]
dev = [
    "black",
    "build",
    "flake8",
    "pylint",
    "pytest",
    "ruff",
    "twine>=7",  # older twine/packaging reject the metadata 2.5 that hatchling writes for an SPDX license
]
test = ["pytest", "coverage"]
doc = ["sphinx", "myst-parser", "sphinx_rtd_theme"]

[project.urls]
Homepage = "https://github.com/chrislee35/orange3-imagenets"
Documentation = "https://chrislee35.github.io/orange3-imagenets/"

[tool.hatch.build.targets.wheel]
# orangecontrib has no __init__.py: it is a namespace shared by every Orange add-on, so only imagenets/ is packaged under it.
packages = ["orangecontrib"]

[tool.hatch.build.targets.sdist]
include = ["orangecontrib", "tests", "doc", "README.md", "LICENSE", "pyproject.toml"]

[project.entry-points."orange.widgets"]
imagenets = "orangecontrib.imagenets.widgets"

[project.entry-points."orange3.addon"]
orange3-imagenets = "orangecontrib.imagenets"

[project.entry-points."orange.canvas.help"]
html-index = "orangecontrib.imagenets.widgets:WIDGET_HELP_PATH"

[tool.black]
line-length = 140
target-version = ["py311"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
extend-select = ["I"]
# flake8 enforces E402 where tests/conftest.py needs late imports; keep ruff from calling its noqa unused.
external = ["E402"]

[tool.ruff.lint.per-file-ignores]
# conftest must run its sys.path setup before importing the package, so its imports cannot be sorted to the top.
"tests/conftest.py" = ["I001"]

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 140

[tool.pylint."messages control"]
# Orange widgets are GUI classes with many attributes, and the module/class docstrings add little.
disable = ["missing-module-docstring", "missing-class-docstring", "missing-function-docstring", "too-many-instance-attributes", "too-few-public-methods"]

[tool.pytest.ini_options]
testpaths = ["tests"]
